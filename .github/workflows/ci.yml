name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the shared cache; PR runs restore from it but do
          # not save. GitHub only lets a branch restore caches from its own ref
          # or the default branch, so without a main-scoped cache every new PR
          # starts cold. This keeps one authoritative cache instead of many
          # unshareable per-PR copies.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  # One build is meant to load in every supported DuckDB: it is stamped for the
  # stable C API (C_STRUCT, v1.2.0) rather than for one release. Nothing else
  # checks that, and a dependency bump can break it without failing a unit
  # test. No AWS credentials needed: load-check.py stops at a bind error, and
  # the e2e suite runs real scans against a fake Glue, Athena and S3.
  load:
    name: DuckDB ${{ matrix.duckdb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Last 1.x, current. Add each new release here. 1.4 left support on
        # 2026-11-17; the build still loads there, but it is no longer tested.
        duckdb: ["1.5.6", "2.0.0"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          # One cache for the whole matrix: the build does not depend on which
          # DuckDB loads it afterwards.
          shared-key: load
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build debug extension
        run: |
          make configure
          make debug

      - name: Load the extension
        run: |
          uv run --no-project --with "duckdb==${{ matrix.duckdb }}" \
            python scripts/load-check.py \
            build/debug/extension/athena/athena.duckdb_extension

      - name: End-to-end against a fake AWS
        run: |
          make e2e E2E_DUCKDB_VERSION="${{ matrix.duckdb }}" \
            E2E_EXTENSION=build/debug/extension/athena/athena.duckdb_extension

  # The C API v2 build: filter pushdown and progress. release.yml publishes it
  # for both platforms, so both are built and tested here first; it loads into
  # exactly one DuckDB version.
  capi-v2:
    name: C API v2 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: osx_arm64
            runner: macos-15
    # Set as release.yml sets it: on osx_arm64 it makes the build pass
    # --target and put its output under target/aarch64-apple-darwin/, and
    # v0.4.2's release failed on exactly that while this job, without it,
    # passed.
    env:
      DUCKDB_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: capi-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Clippy
        run: cargo clippy --locked --features capi-v2 --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --features capi-v2

      - name: Build
        run: |
          make configure
          make release_v2

      - name: End-to-end against a fake AWS
        run: make e2e_v2
