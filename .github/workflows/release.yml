name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    check:
        name: Preflight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Check formatting
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --locked

    build:
        name: Build ${{ matrix.platform }}
        needs: check
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux_amd64
                      runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      library: libduckdb_athena.so
                    - platform: osx_arm64
                      runner: macos-14
                      target: aarch64-apple-darwin
                      library: libduckdb_athena.dylib

        steps:
            - uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Build release extension
              run: cargo build --release --locked --target ${{ matrix.target }}

            - name: Package extension
              env:
                  DUCKDB_ABI_TYPE: C_STRUCT
                  DUCKDB_CAPI_VERSION: v1.2.0
                  DUCKDB_PLATFORM: ${{ matrix.platform }}
                  DUCKDB_EXTENSION_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
              run: |
                  mkdir -p dist/stage
                  export DUCKDB_EXTENSION_VERSION="${DUCKDB_EXTENSION_VERSION:0:31}"
                  # DuckDB derives the init symbol from the extension's file name,
                  # so the file must be named duckdb_athena.duckdb_extension to match
                  # the exported duckdb_athena_init_c_api. Ship it inside a
                  # platform-named tarball rather than renaming the file itself.
                  make package \
                    BUILT_LIB="target/${{ matrix.target }}/release/${{ matrix.library }}" \
                    EXTENSION="dist/stage/duckdb_athena.duckdb_extension"
                  tar -czf "dist/duckdb_athena-${{ matrix.platform }}.tar.gz" \
                    -C dist/stage duckdb_athena.duckdb_extension

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: duckdb_athena-${{ matrix.platform }}
                  path: dist/duckdb_athena-${{ matrix.platform }}.tar.gz
                  if-no-files-found: error

    github-release:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Create release and upload assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "${GITHUB_REF_NAME}" \
                    --notes "Unsigned DuckDB Athena extension build for ${GITHUB_REF_NAME}."
