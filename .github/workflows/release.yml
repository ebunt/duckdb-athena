name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    check:
        name: Preflight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Check formatting
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --locked

    # Two builds per platform:
    #   stable   `make release`: the stable C API, loads in DuckDB 1.4 through 2.0.
    #            Published as athena-<platform>.tar.gz, as before.
    #   capi-v2  `make release_v2`: DuckDB 2.0's C API v2, with filter pushdown
    #            and a moving progress bar. Unstable API, so it loads into exactly
    #            one DuckDB version, which its asset is named after:
    #            athena-<platform>-duckdb-v2.0.0.tar.gz.
    # Both tarballs hold a file named athena.duckdb_extension, since DuckDB
    # derives the init symbol from the file name.
    build:
        name: Build ${{ matrix.platform }} ${{ matrix.variant }}
        needs: check
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                platform: [linux_amd64, osx_arm64]
                variant: [stable, capi-v2]
                include:
                    - platform: linux_amd64
                      runner: ubuntu-latest
                      # The image duckdb/community-extensions builds linux_amd64
                      # in (extension-ci-tools/docker/linux_amd64): glibc 2.28.
                      container: quay.io/pypa/manylinux_2_28_x86_64
                    - platform: osx_arm64
                      runner: macos-15
                      container: ''
                    - variant: stable
                      make_target: release
                      out_dir: build/release/extension/athena
                    - variant: capi-v2
                      make_target: release_v2
                      out_dir: build/v2/extension/athena

        container: ${{ matrix.container }}

        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Install Rust toolchain
              if: matrix.container == ''
              uses: dtolnay/rust-toolchain@stable

            # Building on the runner links against whatever glibc
            # ubuntu-latest ships -- 2.39 today -- and the result then fails to
            # load on Amazon Linux 2023 (2.34), RHEL 9 (2.34), Debian 12 (2.36)
            # or Ubuntu 22.04 (2.35). glibc is backward compatible, so an older
            # baseline runs everywhere newer. The manylinux image already
            # carries git (checkout needs it before this step runs), make, gcc
            # and python3, so only Rust has to be added -- the same toolchain
            # community-extensions installs. macOS has no equivalent problem and
            # builds on the runner.
            - name: Prepare container toolchain
              if: matrix.container != ''
              run: |
                  curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"

            # The same targets duckdb/community-extensions runs, so this pipeline
            # and that one build the stable extension identically. Both targets
            # append the metadata footer, stamped with the same version.
            - name: Build extension
              env:
                  DUCKDB_PLATFORM: ${{ matrix.platform }}
                  EXTENSION_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
              run: |
                  export EXTENSION_VERSION="${EXTENSION_VERSION:0:31}"
                  make configure
                  make ${{ matrix.make_target }}

            # CI cannot boot another distro, but it can read what the binary
            # demands. This is the check that would have caught v0.3.0's asset,
            # which required GLIBC_2.39 and loaded nowhere but Ubuntu 24.04.
            # Keep the baseline in step with the container above.
            - name: Assert the glibc baseline
              if: matrix.platform == 'linux_amd64'
              run: |
                  max=$(strings ${{ matrix.out_dir }}/athena.duckdb_extension \
                        | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
                  echo "highest glibc symbol required: $max"
                  if [ "$(printf '%s\n' "$max" "GLIBC_2.28" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
                    echo "$max exceeds the 2.28 baseline: will not load on Amazon Linux 2023, RHEL 9 or Debian 12"
                    exit 1
                  fi

            - name: Package extension
              run: |
                  mkdir -p dist
                  asset="athena-${{ matrix.platform }}"
                  if [ "${{ matrix.variant }}" = "capi-v2" ]; then
                    asset="$asset-duckdb-$(sed -n 's/^V2_DUCKDB_VERSION=//p' Makefile)"
                  fi
                  # DuckDB derives the init symbol from the file name, so the file
                  # must stay athena.duckdb_extension. Ship it inside a
                  # descriptively named tarball instead of renaming it.
                  tar -czf "dist/$asset.tar.gz" \
                    -C ${{ matrix.out_dir }} athena.duckdb_extension

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.platform }}-${{ matrix.variant }}
                  path: dist/*.tar.gz
                  if-no-files-found: error

    smoke:
        name: Smoke ${{ matrix.platform }} ${{ matrix.variant }}
        needs: build
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                platform: [linux_amd64, osx_arm64]
                variant: [stable, capi-v2]
                include:
                    - platform: linux_amd64
                      runner: ubuntu-latest
                    - platform: osx_arm64
                      runner: macos-15

        steps:
            - uses: actions/checkout@v5

            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.platform }}-${{ matrix.variant }}
                  path: dist

            - name: Unpack
              run: tar -xzf dist/*.tar.gz

            # The installer is a bash script: piping it to sh runs it under
            # dash on Ubuntu, where `[[` is not a builtin, so platform
            # detection silently falls through to a 404 download.
            - name: Install DuckDB CLI
              if: matrix.variant == 'stable'
              run: curl -fsSL https://install.duckdb.org | bash

            # Catches the failure mode that shipped in v0.2.0: an asset that
            # builds and uploads fine but cannot be loaded on its own platform.
            # No AWS credentials needed -- LOAD alone exercises the footer,
            # platform stamp and init symbol.
            - name: Load the stable build in the latest DuckDB
              if: matrix.variant == 'stable'
              run: |
                  version=$(~/.duckdb/cli/latest/duckdb -unsigned -noheader -list -c "
                    LOAD '$PWD/athena.duckdb_extension';
                    SELECT extension_version FROM duckdb_extensions()
                    WHERE extension_name = 'athena';
                  ")
                  echo "loaded, extension_version=$version"
                  test -n "$version" || { echo "extension reported no version"; exit 1; }
                  if [ "${{ github.ref_type }}" = "tag" ]; then
                    test "$version" = "${{ github.ref_name }}" || {
                      echo "footer says $version, tag is ${{ github.ref_name }}"; exit 1; }
                  fi

            - name: Install uv
              if: matrix.variant == 'capi-v2'
              uses: astral-sh/setup-uv@v6

            # The v2 build loads into one DuckDB version only, so it is checked
            # in exactly that version rather than the latest.
            - name: Load the C API v2 build in its DuckDB
              if: matrix.variant == 'capi-v2'
              run: |
                  duckdb_version=$(sed -n 's/^V2_DUCKDB_VERSION=//p' Makefile)
                  expect=()
                  if [ "${{ github.ref_type }}" = "tag" ]; then
                    expect=(--expect-version "${{ github.ref_name }}")
                  fi
                  uv run --no-project --with "duckdb==${duckdb_version#v}" \
                    python scripts/load-check.py "$PWD/athena.duckdb_extension" "${expect[@]}"

    github-release:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build, smoke]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v5

            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Create release and upload assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  v2=$(sed -n 's/^V2_DUCKDB_VERSION=//p' Makefile)
                  cat > notes.md <<NOTES
                  Unsigned DuckDB Athena extension builds for ${GITHUB_REF_NAME}.

                  - \`athena-<platform>.tar.gz\`: the standard build. Loads in DuckDB 1.4.4 through 2.0. Use this one unless you want the extra features below.
                  - \`athena-<platform>-duckdb-${v2}.tar.gz\`: built on DuckDB 2.0's C API v2, which adds filter pushdown (a plain \`WHERE\` reaches Athena) and a progress bar that moves. That API is still unstable, so this build loads in DuckDB ${v2} only.

                  Each tarball holds \`athena.duckdb_extension\`; keep that file name. Load it with \`duckdb -unsigned\`.
                  NOTES
                  sed -i 's/^ *//' notes.md
                  gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "${GITHUB_REF_NAME}" \
                    --notes-file notes.md
