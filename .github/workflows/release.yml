name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

permissions:
    contents: read

jobs:
    check:
        name: Preflight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Check formatting
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --locked

    build:
        name: Build ${{ matrix.platform }}
        needs: check
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux_amd64
                      runner: ubuntu-latest
                      # The image duckdb/community-extensions builds linux_amd64
                      # in (extension-ci-tools/docker/linux_amd64): glibc 2.28.
                      container: quay.io/pypa/manylinux_2_28_x86_64
                    - platform: osx_arm64
                      runner: macos-14
                      container: ''

        container: ${{ matrix.container }}

        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Install Rust toolchain
              if: matrix.container == ''
              uses: dtolnay/rust-toolchain@stable

            # Building on the runner links against whatever glibc
            # ubuntu-latest ships -- 2.39 today -- and the result then fails to
            # load on Amazon Linux 2023 (2.34), RHEL 9 (2.34), Debian 12 (2.36)
            # or Ubuntu 22.04 (2.35). glibc is backward compatible, so an older
            # baseline runs everywhere newer. The manylinux image already
            # carries git (checkout needs it before this step runs), make, gcc
            # and python3, so only Rust has to be added -- the same toolchain
            # community-extensions installs. macOS has no equivalent problem and
            # builds on the runner.
            - name: Prepare container toolchain
              if: matrix.container != ''
              run: |
                  curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"

            # The same targets duckdb/community-extensions runs, so this pipeline
            # and that one build the extension identically. `make release` also
            # appends the metadata footer and leaves the packaged extension at
            # build/release/extension/athena/.
            - name: Build release extension
              env:
                  DUCKDB_PLATFORM: ${{ matrix.platform }}
                  EXTENSION_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
              run: |
                  export EXTENSION_VERSION="${EXTENSION_VERSION:0:31}"
                  make configure
                  make release

            # CI cannot boot another distro, but it can read what the binary
            # demands. This is the check that would have caught v0.3.0's asset,
            # which required GLIBC_2.39 and loaded nowhere but Ubuntu 24.04.
            # Keep the baseline in step with the container above.
            - name: Assert the glibc baseline
              if: matrix.platform == 'linux_amd64'
              run: |
                  max=$(strings build/release/extension/athena/athena.duckdb_extension \
                        | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
                  echo "highest glibc symbol required: $max"
                  if [ "$(printf '%s\n' "$max" "GLIBC_2.28" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
                    echo "$max exceeds the 2.28 baseline: will not load on Amazon Linux 2023, RHEL 9 or Debian 12"
                    exit 1
                  fi

            - name: Package extension
              run: |
                  mkdir -p dist
                  # DuckDB derives the init symbol from the file name, so the file
                  # must stay athena.duckdb_extension to match athena_init_c_api.
                  # Ship it inside a platform-named tarball instead of renaming it.
                  tar -czf "dist/athena-${{ matrix.platform }}.tar.gz" \
                    -C build/release/extension/athena athena.duckdb_extension

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: athena-${{ matrix.platform }}
                  path: dist/athena-${{ matrix.platform }}.tar.gz
                  if-no-files-found: error

    smoke:
        name: Smoke ${{ matrix.platform }}
        needs: build
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux_amd64
                      runner: ubuntu-latest
                    - platform: osx_arm64
                      runner: macos-14

        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                  name: athena-${{ matrix.platform }}
                  path: dist

            # The installer is a bash script: piping it to sh runs it under
            # dash on Ubuntu, where `[[` is not a builtin, so platform
            # detection silently falls through to a 404 download.
            - name: Install DuckDB CLI
              run: curl -fsSL https://install.duckdb.org | bash

            # Catches the failure mode that shipped in v0.2.0: an asset that
            # builds and uploads fine but cannot be loaded on its own platform.
            # No AWS credentials needed -- LOAD alone exercises the footer,
            # platform stamp and init symbol.
            - name: Load the packaged extension
              run: |
                  tar -xzf "dist/athena-${{ matrix.platform }}.tar.gz"
                  version=$(~/.duckdb/cli/latest/duckdb -unsigned -noheader -list -c "
                    LOAD '$PWD/athena.duckdb_extension';
                    SELECT extension_version FROM duckdb_extensions()
                    WHERE extension_name = 'athena';
                  ")
                  echo "loaded, extension_version=$version"
                  test -n "$version" || { echo "extension reported no version"; exit 1; }
                  if [ "${{ github.ref_type }}" = "tag" ]; then
                    test "$version" = "${{ github.ref_name }}" || {
                      echo "footer says $version, tag is ${{ github.ref_name }}"; exit 1; }
                  fi

    github-release:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build, smoke]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Create release and upload assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "${GITHUB_REF_NAME}" \
                    --notes "Unsigned DuckDB Athena extension build for ${GITHUB_REF_NAME}."
