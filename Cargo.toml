[package]
name = "duckdb-athena"
version = "0.4.1"
edition = "2021"

[dependencies]
quack-rs = "=0.20.0"
libduckdb-sys = { version = ">=1.4.4, <2", features = ["loadable-extension"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
aws-config = { version = "1", features = ["credentials-login"] }
aws-sdk-athena = "1"
aws-sdk-glue = "1"
time = { version = "0.3", features = ["macros", "parsing"] }
aws-sdk-s3 = "1"
duckdb-neo = { version = "=0.20000.2", features = ["build-extension"], optional = true }
duckdb-loadable-macros = { version = "=1.20000.2", features = ["neo"], optional = true }

[features]
capi-v2 = ["dep:duckdb-neo", "dep:duckdb-loadable-macros"]

[lib]
name = "athena"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
